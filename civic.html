<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Civic & Jan Shikayat</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-3">
            <city-ad-space></city-ad-space>

            <!-- Civic Header Info -->
            <div class="cp-card flex-between">
                <div>
                    <h3 style="margin: 0 0 4px 0; font-size: 16px;">Jan Shikayat Hub</h3>
                    <p style="margin: 0; font-size: 12px; color: var(--text-muted);">Raise local issues directly to authorities.</p>
                </div>
                <span style="font-size: 28px;">📢</span>
            </div>

            <!-- Complaint Form (Deep Content) -->
            <div class="cp-card flex-column gap-3">
                <h4 style="margin: 0; font-size: 14px;">Raise a New Complaint</h4>
                <div>
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Category</label>
                    <select class="cp-input">
                        <option>Street Light / Bijli</option>
                        <option>Water Supply / Pani</option>
                        <option>Road & Potholes / Sadak</option>
                        <option>Garbage / Kachra</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Details</label>
                    <textarea rows="3" class="cp-input" placeholder="Describe the issue..."></textarea>
                </div>
                <button class="cp-btn-primary" onclick="showLoader(); setTimeout(() => { hideLoader(); showToast('Complaint Submitted!'); }, 1500)">Submit Complaint</button>
            </div>

            <!-- Recent Applications -->
            <div class="cp-card">
                <h4 style="margin: 0 0 12px 0; font-size: 14px;">My Recent Applications</h4>
                <div class="flex-between" style="padding: 10px; background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); border-radius: 10px;">
                    <div>
                        <div style="font-size: 13px; font-weight: 600;">Street Light (#CP-8492)</div>
                        <div style="font-size: 11px; color: var(--text-muted);">Ward No. 12 • 2 days ago</div>
                    </div>
                    <span class="cp-badge-success">Resolved</span>
                </div>
            </div>
        </main>
        
        <bottom-nav></bottom-nav>
    </div>

    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/utils.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/auth-guard.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/api.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
