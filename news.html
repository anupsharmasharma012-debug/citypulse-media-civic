<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Local News</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-3">
            <city-ad-space></city-ad-space>

            <!-- Filters -->
            <div class="d-flex gap-2" style="overflow-x: auto; padding-bottom: 4px;">
                <button class="cp-btn-primary" style="width: auto; border-radius: 20px; padding: 6px 14px;">All News</button>
                <button class="cp-btn-outline" style="width: auto; border-radius: 20px; padding: 6px 14px;">Local Events</button>
                <button class="cp-btn-outline" style="width: auto; border-radius: 20px; padding: 6px 14px;">Municipal</button>
            </div>

            <!-- Featured News Card -->
            <div class="cp-card" style="padding: 0; overflow: hidden;">
                <div style="height: 140px; background: rgba(59,130,246,0.1); display: flex; align-items: center; justify-content: center; font-size: 40px;">📰</div>
                <div style="padding: 16px;">
                    <div class="flex-between" style="margin-bottom: 8px;">
                        <span style="font-size: 10px; background: rgba(59,130,246,0.1); color: var(--accent-blue); padding: 3px 8px; border-radius: 6px; font-weight: 600;">Breaking News</span>
                        <span style="font-size: 11px; color: var(--text-muted);">2 hours ago</span>
                    </div>
                    <h3 style="margin: 0 0 6px 0; font-size: 15px; line-height: 1.4;">New Public Infrastructure Projects Announced</h3>
                    <p style="margin: 0 0 12px 0; font-size: 12px; color: var(--text-muted); line-height: 1.4;">Local municipal authorities have outlined fresh road and utility upgrades...</p>
                    <a href="#" style="font-size: 12px; color: var(--accent-blue); font-weight: 600; text-decoration: none;">Read Full Story ›</a>
                </div>
            </div>
        </main>

        <bottom-nav></bottom-nav>
    </div>

    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
