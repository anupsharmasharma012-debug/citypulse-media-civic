<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Local News & Updates</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <!-- Core Header Integration -->
        <city-header></city-header>

        <main style="padding: 10px 16px; display: flex; flex-direction: column; gap: 16px;">
            <!-- Category Filter Tabs -->
            <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
                <button style="background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">All News</button>
                <button style="background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">Local Events</button>
                <button style="background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">Municipal</button>
                <button style="background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;">Weather & Health</button>
            </div>

            <!-- Featured News Card -->
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden;">
                <div style="height: 140px; background: rgba(59,130,246,0.1); display: flex; align-items: center; justify-content: center; font-size: 40px;">
                    📰
                </div>
                <div style="padding: 16px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 10px; background: rgba(59,130,246,0.1); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-weight: 600;">Breaking News</span>
                        <span style="font-size: 11px; color: var(--text-muted);">2 hours ago</span>
                    </div>
                    <h3 style="font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; line-height: 1.4;">New Public Infrastructure Development Projects Announced for North 24 Parganas</h3>
                    <p style="font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px;">Local municipal authorities have outlined fresh road and utility upgrades starting next month...</p>
                    <a href="#" style="font-size: 12px; color: var(--accent); font-weight: 600; text-decoration: none;">Read Full Story ›</a>
                </div>
            </div>

            <!-- Secondary News List Item -->
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center;">
                <div style="width: 50px; height: 50px; background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;">
                    💡
                </div>
                <div style="flex: 1;">
                    <div style="font-size: 10px; color: var(--text-muted); margin-bottom: 2px;">Utility Alert • Today</div>
                    <h4 style="font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3;">Power Maintenance Schedule Notice</h4>
                </div>
            </div>
        </main>

        <!-- Core Bottom Navigation Integration -->
        <bottom-nav></bottom-nav>
    </div>

    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
